[project]
name = "ollama-mcp-tutorial"
version = "0.1.0"
description = "Ollama, LangChain, FAISS, PDF 문서 임베딩 및 질의응답 챗봇 예제 (ch07/01_tracing_project)"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.1.1",
    "langchain-ollama",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-experimental",
    "faiss-cpu",
    "pypdf",
    "tiktoken",
    "beautifulsoup4",
    "chromadb",
    "mcp>=1.23.1",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
]
