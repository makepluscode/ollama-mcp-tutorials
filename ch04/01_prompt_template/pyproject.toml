[project]
name = "ch04-prompt-template-mock"
version = "0.1.0"
description = "4장 프롬프트 템플릿 목업 — 최신 LangChain을 설치하면 책 코드가 멈추는 상황을 재현해요"
requires-python = ">=3.10"
# 목업: 원본 예제는 langchain==0.3.25 로 고정돼 있어요.
# 여기서는 독자가 최신 LangChain을 설치한 상황을 재현하려고 하한만 둬요.
dependencies = [
    "langchain>=0.3.25",
    "langchain-core>=0.3.61",
]
